<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>英语词族与派生形态树词典</title>
<style>
  :root {
    --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #1e293b;
    --core-bg: #dbeafe; --core-text: #1d4ed8;
    --common-bg: #dcfce7; --common-text: #15803d;
    --rare-bg: #f1f5f9; --rare-text: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0; background: var(--bg); color: var(--text);
    display: flex; height: 100vh; height: 100dvh; overflow: hidden;
  }

  /* 移动端顶部吸顶导航栏（桌面端隐藏） */
  .mobile-topbar {
    display: none;
    position: sticky; top: 0; z-index: 30;
    background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px; align-items: center; justify-content: space-between; gap: 8px;
  }
  .mobile-menu-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: #2563eb; color: #fff; border: none; border-radius: 7px;
    padding: 7px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .mobile-nav-group { display: flex; align-items: center; gap: 6px; }
  .mobile-nav-btn {
    background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155;
    border-radius: 6px; padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .mobile-nav-btn:active { background: #e2e8f0; }

  /* 移动端抽屉遮罩层 */
  .drawer-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
    z-index: 40;
  }
  .drawer-backdrop.open { display: block; }

  /* 左侧边栏（桌面常驻，手机为全高滑出抽屉） */
  .sidebar {
    width: 340px; border-right: 1px solid var(--border); background: var(--card);
    display: flex; flex-direction: column; flex-shrink: 0; height: 100%;
  }
  .status-bar {
    padding: 10px 14px; background: #eff6ff; font-size: 12px;
    border-bottom: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center; color: #1e40af; gap: 8px;
  }
  .status-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .fallback-btn {
    font-size: 11px; color: #2563eb; background: #fff; border: 1px solid #bfdbfe;
    border-radius: 4px; padding: 3px 8px; cursor: pointer;
  }
  .fallback-btn:hover { background: #dbeafe; }
  .mobile-close-btn {
    display: none; font-size: 12px; font-weight: 700; color: #475569;
    background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 3px 9px; cursor: pointer;
  }

  .search-box { padding: 10px 14px 8px 14px; }
  /* 16px 字体防止 iOS Safari 聚焦时自动放大页面 */
  .search-box input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 16px; outline: none; transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: #3b82f6; }

  /* 主词性筛选栏 */
  .pos-filter-bar {
    padding: 0 14px 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .pos-chip {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 14px;
    border: 1px solid #cbd5e1; background: #f8fafc; color: #475569;
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .pos-chip:hover { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }
  .pos-chip.active { background: #2563eb; border-color: #2563eb; color: #ffffff; }
  
  .family-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
  
  /* 一级词频分段 */
  .freq-group { border-bottom: 1px solid var(--border); }
  .freq-group-header {
    padding: 12px 14px; background: #eef2f6; font-size: 13px; font-weight: 700; color: #1e293b;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none;
    position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #cbd5e1;
  }
  .freq-group-header:hover { background: #e2e8f0; }
  .freq-group-body { display: block; }
  .freq-group.collapsed .freq-group-body { display: none; }

  /* 二级 200词分段 */
  .sub-group { border-bottom: 1px solid #f1f5f9; }
  .sub-group-header {
    padding: 9px 14px 9px 22px; background: #f8fafc; font-size: 12.5px; font-weight: 600; color: #475569;
    cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none;
    position: sticky; top: 41px; z-index: 5; border-bottom: 1px solid #f1f5f9;
  }
  .sub-group-header:hover { background: #f1f5f9; color: #0f172a; }
  .sub-group-body { display: block; }
  .sub-group.collapsed .sub-group-body { display: none; }

  .arrow-icon { font-size: 10px; color: #64748b; transition: transform 0.18s; display: inline-block; margin-right: 6px; width: 10px; }
  .freq-group.collapsed > .freq-group-header .arrow-icon,
  .sub-group.collapsed > .sub-group-header .arrow-icon { transform: rotate(-90deg); }

  .group-count { font-size: 11px; font-weight: 700; color: #1e40af; background: #dbeafe; padding: 2px 8px; border-radius: 10px; border: 1px solid #bfdbfe; flex-shrink: 0; }
  .sub-count { font-size: 10.5px; font-weight: 600; color: #475569; background: #fff; padding: 1px 7px; border-radius: 8px; border: 1px solid #cbd5e1; flex-shrink: 0; }

  /* 左侧词条 */
  .family-item {
    padding: 10px 14px 10px 34px; border-bottom: 1px solid #f8fafc; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; font-size: 14px;
  }
  .family-item:hover { background: #f1f5f9; }
  .family-item.active { background: #eff6ff; color: #1d4ed8; font-weight: 700; border-left: 3px solid #2563eb; padding-left: 31px; }
  .family-meta { display: flex; align-items: center; gap: 6px; }
  .mini-pos { font-size: 10.5px; color: #64748b; background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
  .family-rank { font-size: 11.5px; color: #94a3b8; font-weight: 400; }

  /* 右侧主视图 */
  .main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .main {
    flex: 1; padding: 24px 36px; overflow-y: auto;
    -webkit-overflow-scrolling: touch; padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  .toolbar { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .header-title { font-size: 30px; font-weight: 800; color: #0f172a; word-break: break-word; }
  
  .phonetic-tag {
    font-family: "Lucida Sans Unicode", "DejaVu Sans", -apple-system, sans-serif;
    font-size: 15px; color: #475569; background: #f1f5f9; padding: 3px 9px;
    border-radius: 6px; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.15s;
  }
  .phonetic-tag:hover { background: #e0f2fe; border-color: #7dd3fc; color: #0369a1; }

  .phonetic-sm {
    font-family: "Lucida Sans Unicode", "DejaVu Sans", -apple-system, sans-serif;
    font-size: 13.5px; color: #64748b; cursor: pointer; padding: 1px 5px; border-radius: 4px; transition: all 0.15s;
  }
  .phonetic-sm:hover { background: #eff6ff; color: #1d4ed8; }

  .tts-btn {
    display: inline-flex; align-items: center; gap: 3px;
    background: #fff; border: 1px solid #cbd5e1; border-radius: 6px;
    padding: 4px 9px; font-size: 12px; font-weight: 600; color: #334155;
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .tts-btn:hover { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
  .tts-btn:active { transform: scale(0.96); }
  .tts-btn.speaking { background: #dbeafe; border-color: #2563eb; color: #1d4ed8; }

  .voice-status {
    font-size: 11.5px; color: #64748b; background: #f8fafc; border: 1px solid #e2e8f0;
    padding: 3px 8px; border-radius: 5px;
  }
  .desktop-nav-group { display: inline-flex; align-items: center; gap: 6px; }
  .desktop-nav-btn {
    background: #ffffff; border: 1px solid #cbd5e1; color: #334155;
    border-radius: 6px; padding: 5px 11px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .desktop-nav-btn:hover { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
  .desktop-nav-btn:active { transform: scale(0.97); }

  .guide-box {
    background: #f0f9ff; border: 1px solid #bae6fd; border-left: 4px solid #0284c7;
    border-radius: 8px; padding: 12px 15px; margin-bottom: 16px; font-size: 14px; line-height: 1.65; color: #0f172a;
  }
  .guide-distinction { margin-top: 6px; color: #0369a1; }

  .pos-section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .pos-header { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  
  .pos-badge { padding: 3px 9px; border-radius: 5px; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
  .pos-n { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
  .pos-v { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .pos-adj { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
  .pos-adv { background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
  .pos-prep { background: #ccfbf1; color: #115e59; border: 1px solid #99f6e4; }
  .pos-conj { background: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
  .pos-pron { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .pos-det { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
  .pos-other { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }

  .lemma-card { border-left: 3px solid #cbd5e1; padding: 12px 14px; margin-bottom: 12px; background: #fafafa; border-radius: 0 8px 8px 0; }
  .lemma-card.tier-core { border-left-color: #2563eb; background: #f8faff; }
  .lemma-card.tier-rare { opacity: 0.8; }
  .hide-rare .tier-rare { display: none; }
  .hide-images .lemma-visual-wrap { display: none !important; }
  .lemma-body-flex { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .lemma-text-col { flex: 1; min-width: 0; }
  .lemma-visual-wrap {
    flex-shrink: 0; width: 112px; height: 112px; border-radius: 8px;
    border: 1px solid #e2e8f0; background: #ffffff; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04); cursor: zoom-in;
  }
  .lemma-visual-wrap.loading { background: #f8fafc; }
  .lemma-visual-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
  .lemma-visual-wrap:hover img { transform: scale(1.05); }
  @media (max-width: 768px) {
    .lemma-visual-wrap { width: 88px; height: 88px; }
  }
  
  .lemma-top { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; flex-wrap: wrap; }
  .lemma-word { font-size: 18px; font-weight: 700; color: #0f172a; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 12px; font-weight: 600; }
  .tag-core { background: var(--core-bg); color: var(--core-text); }
  .tag-common { background: var(--common-bg); color: var(--common-text); }
  .tag-rare { background: var(--rare-bg); color: var(--rare-text); }
  
  .lemma-def { font-size: 14px; color: #334155; margin: 4px 0 8px 0; line-height: 1.55; }
  .def-zh { font-weight: 600; color: #0f172a; }
  .def-en { color: #64748b; margin-left: 6px; font-style: italic; }
  
  .lemma-usage {
    background: #fffbeb; border: 1px solid #fde68a; border-left: 3px solid #f59e0b;
    color: #78350f; font-size: 13px; line-height: 1.55; padding: 6px 10px;
    border-radius: 0 6px 6px 0; margin: 6px 0 8px 0;
  }
  .lemma-examples { background: #ffffff; border-left: 2px solid #94a3b8; padding: 7px 11px; margin: 6px 0 10px 0; font-size: 13.5px; border-radius: 0 6px 6px 0; }
  .example-item { margin-bottom: 5px; line-height: 1.5; }
  .example-item:last-child { margin-bottom: 0; }
  .ex-en { color: #1e293b; }
  .ex-zh { color: #64748b; font-size: 12.5px; padding-left: 10px; }

  .inflection-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .slot-pill { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
  .slot-label { color: #64748b; font-size: 11.5px; }
  .word-click { cursor: pointer; border-bottom: 1px dashed transparent; transition: all 0.15s; }
  .word-click:hover { color: #2563eb; border-bottom-color: #2563eb; }

  /* ================= 移动端自适应断点 (<= 768px) ================= */
  @media (max-width: 768px) {
    .mobile-topbar { display: flex; }
    .mobile-close-btn { display: inline-block; }
    .voice-status, .desktop-nav-group { display: none; }

    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 88vw; max-width: 360px;
      z-index: 50;
      transform: translateX(-105%);
      transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 4px 0 24px rgba(15, 23, 42, 0.18);
    }
    .sidebar.open { transform: translateX(0); }

    .main { padding: 14px 14px calc(32px + env(safe-area-inset-bottom)) 14px; }
    .header-title { font-size: 26px; }
    .toolbar { gap: 10px; margin-bottom: 12px; padding-bottom: 12px; }
    .toolbar-right { width: 100%; justify-content: space-between; margin-left: 0 !important; }
    .pos-section { padding: 12px; }
    .lemma-card { padding: 10px 12px; }
  }

  /* 动词短语与习语手风琴紧凑样式 */
  .vp-item {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px;
    margin-bottom: 6px; overflow: hidden; transition: border-color 0.15s;
  }
  .vp-item:hover { border-color: #93c5fd; }
  .vp-summary {
    padding: 8px 12px; display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; line-height: 1.45;
  }
  .vp-summary:hover { background: #f8fafc; }
  .vp-chevron {
    font-size: 11px; color: #64748b; transition: transform 0.18s;
    display: inline-block; width: 12px; flex-shrink: 0;
  }
  .vp-item.open .vp-chevron { transform: rotate(90deg); color: #2563eb; }
  .vp-phrase-title { font-size: 14.5px; font-weight: 700; color: #0f172a; flex-shrink: 0; }
  .vp-meaning-preview {
    font-size: 13.5px; color: #475569; flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .vp-item.open .vp-meaning-preview { white-space: normal; color: #334155; }
  .vp-details {
    display: none; padding: 8px 12px 10px 32px;
    background: #f8fafc; border-top: 1px dashed #e2e8f0;
  }
  .vp-item.open .vp-details { display: block; }
  .vp-sense-row { margin-bottom: 8px; padding-left: 8px; border-left: 2px solid #93c5fd; }
  .vp-sense-row:last-child { margin-bottom: 0; }
  .vp-sense-meaning { font-size: 13.5px; font-weight: 600; color: #1e293b; margin-bottom: 2px; }
  .vp-sense-en { font-size: 13px; color: #334155; }
  .vp-sense-zh { font-size: 12.5px; color: #64748b; }
  .vp-hidden-item { display: none; }
  .vp-group.show-all .vp-hidden-item { display: block; }
  .vp-more-btn {
    width: 100%; padding: 7px; margin-top: 4px; background: #ffffff;
    border: 1px dashed #cbd5e1; border-radius: 7px; color: #2563eb;
    font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .vp-more-btn:hover { background: #eff6ff; border-color: #93c5fd; }


  /* 搜索命中短语高亮 & 收藏按钮样式 */
  .vp-item.vp-match { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2); }
  .vp-item.vp-match > .vp-summary { background: #fffbeb; }
  .fav-btn {
    background: #ffffff; border: 1px solid #cbd5e1; color: #475569;
    border-radius: 6px; padding: 4px 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .fav-btn:hover { background: #fefce8; border-color: #facc15; color: #a16207; }
  .fav-btn.active { background: #fef9c3; border-color: #eab308; color: #854d0e; }

</style>
</head>
<body>

<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeMobileDrawer()"></div>

<div class="sidebar" id="sidebar">
  <div class="status-bar">
    <span id="loadStatus">正在自动加载词库...</span>
    <div class="status-actions">
      <label class="fallback-btn" title="本地离线浏览时可手动选择 JSON">
        本地文件
        <input type="file" id="jsonFile" accept=".json" style="display:none;">
      </label>
      <button class="mobile-close-btn" onclick="closeMobileDrawer()">✕ 关闭</button>
    </div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索词头、派生词、释义或词形...">
  </div>
  <div class="pos-filter-bar" id="posFilterBar">
    <button class="pos-chip active" data-pos="ALL" onclick="setPosFilter('ALL')">全部</button>
    <button class="pos-chip" data-pos="v." onclick="setPosFilter('v.')">动词 v.</button>
    <button class="pos-chip" data-pos="n." onclick="setPosFilter('n.')">名词 n.</button>
    <button class="pos-chip" data-pos="adj." onclick="setPosFilter('adj.')">形容词 adj.</button>
    <button class="pos-chip" data-pos="adv." onclick="setPosFilter('adv.')">副词 adv.</button>
    <button class="pos-chip" data-pos="OTHER" onclick="setPosFilter('OTHER')">虚词/其他</button>
    <button class="pos-chip" data-pos="FAV" onclick="setPosFilter('FAV')">⭐ 已收藏</button>
  </div>
  <div class="family-list" id="familyList"></div>
</div>

<div class="main-wrapper">
  <div class="mobile-topbar">
    <button class="mobile-menu-btn" onclick="openMobileDrawer()">☰ 词库 / 筛选</button>
    <span id="mobileCurrentWord" style="font-weight:700; font-size:15px; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
    <div class="mobile-nav-group">
      <button class="mobile-nav-btn" onclick="stepFamily(-1)">‹ 上一词</button>
      <button class="mobile-nav-btn" onclick="stepFamily(1)">下一词 ›</button>
    </div>
  </div>

  <div class="main" id="mainView">
    <div style="padding:40px 20px; text-align:center; color:#64748b;">
      <h3>正在加载英语词族数据库...</h3>
      <p style="font-size:13px;">首次打开需下载词典数据包，加载后浏览器会自动缓存。</p>
    </div>
  </div>
</div>

<script>
const DATA_URL = `./word_families_final.json?v=${Date.now()}`;

let allFamilies = [];
let currentFilteredList = [];
let activeRank = null;
let favoriteRanks = new Set(JSON.parse(localStorage.getItem("dict_fav_ranks") || "[]"));

function toggleFavorite(rank) {
  if (favoriteRanks.has(rank)) {
    favoriteRanks.delete(rank);
  } else {
    favoriteRanks.add(rank);
  }
  localStorage.setItem("dict_fav_ranks", JSON.stringify([...favoriteRanks]));
  if (selectedPos === "FAV") applyFilters();
  selectFamily(rank, false);
}
let verbPhrasesMap = {};
fetch(`./verb_phrases.json?v=${Date.now()}`)
  .then(r => r.ok ? r.json() : {})
  .then(data => {
    verbPhrasesMap = data || {};
    if (activeRank) selectFamily(activeRank, false);
  })
  .catch(() => {});
let hideRare = false;
let showImages = localStorage.getItem("dict_show_images") !== "false";
const wikiImageCache = new Map();

function toggleImages(checked) {
  showImages = checked;
  localStorage.setItem("dict_show_images", checked ? "true" : "false");
  const main = document.getElementById("mainView");
  main.classList.toggle("hide-images", !showImages);
  if (showImages) loadVisibleVisuals();
}

async function fetchWikiThumb(word) {
  const key = word.toLowerCase();
  if (wikiImageCache.has(key)) return wikiImageCache.get(key);
  try {
    // 第一步：查精确词条摘要图
    const sumUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(key)}`;
    const resp = await fetch(sumUrl);
    if (resp.ok) {
      const data = await resp.json();
      if (data.type !== "disambiguation" && data.thumbnail && data.thumbnail.source) {
        wikiImageCache.set(key, data.thumbnail.source);
        return data.thumbnail.source;
      }
    }
    // 第二步：遇消歧义页（如 Rake / Dam）时，通过 MediaWiki Search API 抓取排第一的实物词条主图
    const apiUrl = `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(key)}&gsrlimit=3&prop=pageimages&pithumbsize=320&format=json&origin=*`;
    const sResp = await fetch(apiUrl);
    if (sResp.ok) {
      const sData = await sResp.json();
      const pages = sData.query && sData.query.pages ? Object.values(sData.query.pages) : [];
      pages.sort((a, b) => (a.index || 99) - (b.index || 99));
      const hit = pages.find(p => p.thumbnail && p.thumbnail.source);
      if (hit) {
        wikiImageCache.set(key, hit.thumbnail.source);
        return hit.thumbnail.source;
      }
    }
    wikiImageCache.set(key, null);
    return null;
  } catch (e) {
    wikiImageCache.set(key, null);
    return null;
  }
}

  if (!list.length) return;

function pickBestVoice(lang) {
  const voices = window.speechSynthesis.getVoices();
  const langVoices = voices.filter(v => v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase());
  const pool = langVoices.length ? langVoices : voices.filter(v => v.lang.toLowerCase().startsWith('en'));

  const nonRobotic = pool.filter(v => !/Fred|Albert|Bad|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good|Hysterical|Junior|Kathy|Organ|Princess|Ralph|Trinoids|Whisper|Zarvox/i.test(v.name));
  const candidates = nonRobotic.length ? nonRobotic : pool;

  const scoreVoice = (v) => {
    let s = 0;
    if (/Premium|Enhanced|Natural|Neural|Siri/i.test(v.name)) s += 100;
    if (/Google/i.test(v.name)) s += 60;
    if (/Ava|Zoe|Evan|Tom|Allison|Susan|Serena|Daniel|Kate|Oliver|Samantha/i.test(v.name)) s += 30;
    if (v.localService) s += 10;
    return s;
  };

  candidates.sort((a, b) => scoreVoice(b) - scoreVoice(a));
  return candidates[0] || null;
}

function speakText(text, lang = 'en-US', btnEl = null) {
  if (!('speechSynthesis' in window)) {
    alert('当前浏览器不支持语音合成朗读。');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = 1.0;

  const bestVoice = pickBestVoice(lang);
  if (bestVoice) {
    utter.voice = bestVoice;
    currentVoiceName = bestVoice.name;
    const badge = document.getElementById('voiceStatusBadge');
    if (badge) badge.textContent = `当前语音: ${bestVoice.name}`;
  }

  if (btnEl) {
    btnEl.classList.add('speaking');
    utter.onend = () => btnEl.classList.remove('speaking');
    utter.onerror = () => btnEl.classList.remove('speaking');
  }
  window.speechSynthesis.speak(utter);
}

function matchesPos(fam) {
  if (selectedPos === 'ALL') return true;
  if (selectedPos === 'FAV') return favoriteRanks.has(fam.rank);
  const p = fam.primary_pos;
  if (selectedPos === 'OTHER') {
    return !['v.', 'n.', 'adj.', 'adv.'].includes(p);
  }
  return p === selectedPos;
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = allFamilies.filter(f => {
    if (!matchesPos(f)) return false;
    if (!q) return true;
    if (f.headword.toLowerCase().includes(q)) return true;
    const vpEntry = verbPhrasesMap[f.headword.toLowerCase()];
    if (vpEntry && JSON.stringify(vpEntry).toLowerCase().includes(q)) return true;
    return f.pos_branches.some(b => b.lemmas.some(l =>
      l.lemma.toLowerCase().includes(q) ||
      (l.def_zh && l.def_zh.toLowerCase().includes(q)) ||
      Object.values(l.inflections).flat().some(w => w.toLowerCase().includes(q))
    ));
  });

  currentFilteredList = filtered;

  const statusEl = document.getElementById('loadStatus');
  if (selectedPos === 'ALL' && !q) {
    statusEl.textContent = baseStatusText;
  } else {
    const posLabel = selectedPos === 'ALL' ? '全部词性' : (selectedPos === 'OTHER' ? '虚词/其他' : selectedPos);
    statusEl.textContent = `筛选 [${posLabel}]: ${filtered.length.toLocaleString()} 词族`;
  }

  renderGroupedSidebar(filtered, Boolean(q));
}

function renderGroupedSidebar(list, forceExpandAll = false) {
  const container = document.getElementById('familyList');
  if (!list.length) {
    container.innerHTML = '<div style="padding:20px;color:#94a3b8;font-size:13px;text-align:center;">当前筛选条件下无匹配词族</div>';
    return;
  }

  let html = '';

  FREQ_BANDS.forEach(band => {
    const bandItems = list.filter(f => f.rank >= band.min && f.rank <= band.max);
    if (bandItems.length === 0) return;

    const isBandOpen = forceExpandAll ? true : (openState.has(band.id) ? openState.get(band.id) : band.defaultOpen);
    const maxRankInBand = Math.min(band.max, bandItems[bandItems.length - 1].rank);
    let subHtml = '';

    const activeStep = (selectedPos === 'ALL') ? SUB_STEP : 1000;
    for (let start = band.min; start <= maxRankInBand; start += activeStep) {
      const end = Math.min(start + activeStep - 1, band.max);
      const subItems = bandItems.filter(f => f.rank >= start && f.rank <= end);
      if (subItems.length === 0) continue;

      const subId = `sub-${start}-${end}`;
      const isSubOpen = forceExpandAll ? true : (openState.get(subId) || false);

      const itemsHtml = subItems.map(f => `
        <div class="family-item ${f.rank === activeRank ? 'active' : ''}" data-rank="${f.rank}" onclick="selectFamily(${f.rank}, true)">
          <span>${f.headword}</span>
          <span class="family-meta">
            ${selectedPos === 'ALL' ? `<span class="mini-pos">${f.primary_pos}</span>` : ''}
            <span class="family-rank">#${f.rank}</span>
          </span>
        </div>
      `).join('');

      subHtml += `
        <div class="sub-group ${isSubOpen ? '' : 'collapsed'}" id="${subId}">
          <div class="sub-group-header" onclick="toggleGroup('${subId}')">
            <span><span class="arrow-icon">▼</span>${start.toLocaleString()} – ${end.toLocaleString()}</span>
            <span class="sub-count">${subItems.length} 词</span>
          </div>
          <div class="sub-group-body">
            ${itemsHtml}
          </div>
        </div>
      `;
    }

    html += `
      <div class="freq-group ${isBandOpen ? '' : 'collapsed'}" id="${band.id}">
        <div class="freq-group-header" onclick="toggleGroup('${band.id}')">
          <span><span class="arrow-icon">▼</span>${band.label}</span>
          <span class="group-count">${bandItems.length.toLocaleString()} 词</span>
        </div>
        <div class="freq-group-body">
          ${subHtml}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

}

function renderVerbPhrasesSection(headword) {
  const vp = verbPhrasesMap[(headword || '').toLowerCase()];
  if (!vp) return '';
  const groups = [
    { key: 'phrasal_verbs', title: '动词短语 Phrasal Verbs', tagColor: '#1d4ed8', limit: 6 },
    { key: 'idioms', title: '地道习语 Idioms', tagColor: '#a16207', limit: 4 },
    { key: 'collocations', title: '常用搭配 Collocations', tagColor: '#15803d', limit: 4 }
  ];
  const hasAny = groups.some(g => Array.isArray(vp[g.key]) && vp[g.key].length > 0);
  if (!hasAny) return '';

  let sectionsHtml = '';
  for (const g of groups) {
    const items = vp[g.key] || [];
    if (!items.length) continue;

    const qNow = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
    let hasMatchedItem = false;

    const rows = items.map((item, idx) => {
      const pSafe = escapeAttr(item.phrase);
      // 兼容多义项 senses 数组与旧版单义项格式
      const senses = Array.isArray(item.senses) && item.senses.length
        ? item.senses
        : [{ meaning: item.meaning || '', example_en: item.example_en || '', example_zh: item.example_zh || '' }];
      const isMatch = Boolean(qNow) && (
        item.phrase.toLowerCase().includes(qNow) ||
        senses.some(s => (s.meaning || '').toLowerCase().includes(qNow) || (s.example_en || '').toLowerCase().includes(qNow) || (s.example_zh || '').toLowerCase().includes(qNow))
      );
      if (isMatch) hasMatchedItem = true;

      const previewText = senses.length > 1
        ? senses.map((s, i) => `${i + 1}. ${s.meaning}`).join('  ·  ')
        : senses[0].meaning;

      const sensesHtml = senses.map((s, i) => {
        const exSafe = escapeAttr(s.example_en || '');
        const numBadge = senses.length > 1 ? `<span style="color:#2563eb;font-weight:700;margin-right:4px;">${i + 1}.</span>` : '';
        return `
          <div class="vp-sense-row">
            <div class="vp-sense-meaning">${numBadge}${s.meaning}</div>
            ${s.example_en ? `
              <div class="vp-sense-en">• ${s.example_en} <button class="tts-btn" style="padding:1px 6px;font-size:11px;" title="朗读例句" onclick="event.stopPropagation();speakText('${exSafe}', 'en-US', this)">🔊</button></div>
              <div class="vp-sense-zh">${s.example_zh || ''}</div>
            ` : ''}
          </div>`;
      }).join('');

      const hiddenCls = (idx >= g.limit && !hasMatchedItem) ? 'vp-hidden-item' : '';
      const openCls = isMatch ? 'open vp-match' : '';
      return `
        <div class="vp-item ${hiddenCls} ${openCls}">
          <div class="vp-summary" onclick="toggleVpItem(this)">
            <span class="vp-chevron">▶</span>
            <span class="vp-phrase-title">${item.phrase}</span>
            <button class="tts-btn" style="padding:2px 7px;font-size:11.5px;flex-shrink:0;" title="朗读短语" onclick="event.stopPropagation();speakText('${pSafe}', 'en-US', this)">🔊</button>
            <span class="vp-meaning-preview" title="${escapeAttr(previewText)}">${previewText}</span>
          </div>
          <div class="vp-details">
            ${sensesHtml}
          </div>
        </div>`;
    }).join('');

    const extraCount = items.length - g.limit;
    const moreBtnHtml = (extraCount > 0 && !hasMatchedItem)
      ? `<button class="vp-more-btn" onclick="this.closest('.vp-group').classList.add('show-all');this.style.display='none';">展开其余 ${extraCount} 条${g.title.split(' ')[0]} ▾</button>`
      : '';

    sectionsHtml += `
      <div class="vp-group ${hasMatchedItem ? 'show-all' : ''}" style="margin-top:12px;">
        <div style="font-size:13px;font-weight:700;color:${g.tagColor};margin-bottom:6px;">${g.title}（${items.length}）</div>
        ${rows}
        ${moreBtnHtml}
      </div>`;
  }

  return `
    <div class="pos-section" style="background:#f8fafc;">
      <div class="pos-header" style="margin-bottom:4px;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:6px;">
          <span>🧩 高频短语、习语与固定搭配</span>
          <span style="font-size:12px;font-weight:500;color:#64748b;">(点击短语展开多义项例句)</span>
        </div>

      </div>
      ${sectionsHtml}
    </div>`;
}

  const branchesHtml = fam.pos_branches.map(b => {
    const lemmasHtml = b.lemmas.map(l => {

      ` : '';

      const infHtml = Object.entries(l.inflections).map(([slot, words]) => {
        const clickableWords = words.map(w =>
          `<strong class="word-click" title="点击发音: ${w}" onclick="speakText('${escapeAttr(w)}', 'en-US')">${w}</strong>`
        ).join(', ');
        return `
          <div class="slot-pill">
            <span class="slot-label">${SLOT_NAMES[slot] || slot}:</span>
            ${clickableWords}
          </div>
        `;
      }).join('');

      const visualHtml = (b.pos === "n." && l.img)
        ? `<div class="lemma-visual-wrap" onclick="window.open('./images/${l.img}', '_blank')" title="点击查看大图"><img src="./images/${l.img}" alt="${wSafe}" loading="lazy" onerror="this.parentElement.remove()"></div>`
        : "";

      return `
        <div class="lemma-card tier-${l.tier}">
          <div class="lemma-body-flex">
            <div class="lemma-text-col">
              <div class="lemma-top">
                <span class="lemma-word">${l.lemma}</span>
                ${lIpaText ? `<span class="phonetic-sm" title="点击朗读美音" onclick="speakText('${wSafe}', 'en-US')">${lIpaText}</span>` : ''}
                <button class="tts-btn" title="美式发音" onclick="speakText('${wSafe}', 'en-US', this)">🔊 美</button>
                <button class="tts-btn" title="英式发音" onclick="speakText('${wSafe}', 'en-GB', this)">🔊 英</button>
                <span class="tag tag-${l.tier}">${tierLabel}</span>
                <span style="font-size:12px;color:#94a3b8;">Zipf: ${l.zipf}</span>
              </div>
              ${defHtml}
              ${usageHtml}
              ${examplesHtml}
              <div class="inflection-grid">${infHtml}</div>
            </div>
            ${visualHtml}
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="pos-section">
        <div class="pos-header">${getPosBadgeHtml(b.pos, true)} 词性分支</div>
        ${lemmasHtml}
      </div>
    `;
  }).join('');

  main.innerHTML = `
    <div class="toolbar">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
        <span class="header-title">${fam.headword}</span>
        ${hwIpaText ? `<span class="phonetic-tag" title="点击朗读美音" onclick="speakText('${hwSafe}', 'en-US')">${hwIpaText}</span>` : ''}
        <button class="tts-btn" title="美式发音" onclick="speakText('${hwSafe}', 'en-US', this)">🔊 美音</button>
        <button class="tts-btn" title="英式发音" onclick="speakText('${hwSafe}', 'en-GB', this)">🔊 英音</button>
        <span style="color:#64748b;font-size:13.5px;">Rank #${fam.rank} · 主词性</span>
        ${getPosBadgeHtml(fam.primary_pos, false)}
      </div>
      <div class="toolbar-right" style="margin-left:auto; display:flex; align-items:center; gap:12px;">
        <button class="fav-btn ${favoriteRanks.has(fam.rank) ? 'active' : ''}" onclick="toggleFavorite(${fam.rank})">${favoriteRanks.has(fam.rank) ? '⭐ 已收藏' : '☆ 收藏'}</button>
        <div class="desktop-nav-group">
          <button class="desktop-nav-btn" title="上一个词族 (快捷键 ←)" onclick="stepFamily(-1)">‹ 上一词</button>
          <button class="desktop-nav-btn" title="下一个词族 (快捷键 →)" onclick="stepFamily(1)">下一词 ›</button>
        </div>
        <span class="voice-status" id="voiceStatusBadge">当前语音: ${currentVoiceName}</span>
        <label style="font-size:13.5px; cursor:pointer; user-select:none;">
          <input type="checkbox" ${showImages ? 'checked' : ''} onchange="toggleImages(this.checked)"> 实物配图
        </label>
        <label style="font-size:13.5px; cursor:pointer; user-select:none;">
          <input type="checkbox" ${hideRare ? 'checked' : ''} onchange="toggleRare(this.checked)"> 隐藏罕见词 (Rare)
        </label>
      </div>
    </div>
    ${guideHtml}
    ${branchesHtml}
    ${renderVerbPhrasesSection(fam.headword)}
  `;
  loadVisibleVisuals();
}
</script>



</body>
</html>
