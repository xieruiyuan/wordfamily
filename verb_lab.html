<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Native Verb Taxonomy Lab · 动词四维语义辨析库</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "PingFang SC", sans-serif;
    background: #f8fafc; color: #0f172a;
    display: flex; height: 100vh; overflow: hidden;
  }

  /* 左侧边栏 */
  .sidebar {
    width: 268px; flex-shrink: 0; background: #ffffff;
    border-right: 1px solid #e2e8f0; display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .brand { padding: 16px 18px 14px; border-bottom: 1px solid #f1f5f9; }
  .brand h1 { font-size: 16px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em; }
  .meta-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; font-size: 11.5px; color: #64748b;
  }
  .meta-row a { color: #2563eb; text-decoration: none; font-weight: 600; }
  .meta-row a:hover { text-decoration: underline; }

  .mode-list { padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 4px; }
  .mode-btn {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 8px 11px; border: none; border-radius: 8px;
    background: transparent; color: #334155; font-size: 13px; font-weight: 600;
    cursor: pointer; text-align: left; transition: all 0.12s;
  }
  .mode-btn:hover { background: #f1f5f9; }
  .mode-btn.active { background: #0f172a; color: #ffffff; }
  .mode-badge {
    font-size: 11px; font-weight: 700; padding: 1.5px 7px; border-radius: 99px;
    background: #f1f5f9; color: #475569;
  }
  .mode-btn.active .mode-badge { background: rgba(255,255,255,0.18); color: #ffffff; }

  .dom-header {
    padding: 12px 18px 6px; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.06em; color: #94a3b8; text-transform: uppercase;
  }
  .dom-list { padding: 0 10px 18px; display: flex; flex-direction: column; gap: 2px; }
  .dom-btn {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; padding: 6.5px 11px; border: none; border-radius: 7px;
    background: transparent; color: #475569; font-size: 12.5px; font-weight: 500;
    cursor: pointer; text-align: left; transition: all 0.1s;
  }
  .dom-btn:hover { background: #f8fafc; color: #0f172a; }
  .dom-btn.active { background: #eff6ff; color: #1d4ed8; font-weight: 700; }
  .dom-count { font-size: 11px; color: #94a3b8; font-weight: 600; }
  .dom-btn.active .dom-count { color: #2563eb; }

  /* 右侧主区 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .topbar {
    padding: 11px 22px; background: #ffffff; border-bottom: 1px solid #e2e8f0;
    flex-shrink: 0; z-index: 10;
  }
  .topbar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 12px; }
  .mode-desc { font-size: 13px; color: #334155; font-weight: 500; }
  .stat-pill {
    font-size: 11.5px; color: #475569; background: #f1f5f9;
    padding: 3px 10px; border-radius: 99px; font-weight: 600; white-space: nowrap;
  }
  .filters { display: flex; flex-wrap: nowrap; gap: 6px; align-items: center; overflow-x: auto; }
  .ctrl {
    padding: 5px 9px; border: 1px solid #cbd5e1; border-radius: 7px;
    font-size: 12px; background: #ffffff; color: #1e293b; outline: none; white-space: nowrap;
  }
  .ctrl:focus { border-color: #3b82f6; }
  .toggle-btn { cursor: pointer; font-weight: 600; background: #f8fafc; }
  .toggle-btn:hover { background: #f1f5f9; }
  .toggle-btn.active-zh { background: #eff6ff; color: #1d4ed8; border-color: #93c5fd; }
  .search-input { flex: 1; min-width: 140px; max-width: 220px; }
  .reset-btn {
    padding: 5px 10px; border: 1px solid #e2e8f0; border-radius: 7px;
    background: #f8fafc; color: #64748b; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .reset-btn:hover { background: #f1f5f9; color: #0f172a; }

  /* 内容流 */
  .content {
    flex: 1; overflow-y: auto; padding: 20px 24px 54px;
    display: flex; flex-direction: column; gap: 26px;
  }

  /* 语义框架大类卡片（Level 1 主容器） */
  .group-card {
    background: #ffffff; border: 1.5px solid #cbd5e1; border-top: 4px solid #0f172a;
    border-radius: 14px; padding: 18px 22px 22px;
    box-shadow: 0 3px 10px rgba(15,23,42,0.05);
  }
  .group-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 14px; cursor: pointer; user-select: none;
    padding-bottom: 12px; border-bottom: 1.5px solid #e2e8f0;
  }
  .group-card.is-collapsed .group-header { padding-bottom: 0; border-bottom: none; }
  .group-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
  .group-title { font-size: 18.5px; font-weight: 800; color: #0f172a; letter-spacing: -0.015em; }

  /* 句法配价分区横幅（Level 2 子分类主轴） */
  .syntax-sec {
    margin-top: 22px; padding-top: 18px; border-top: 1.5px dashed #cbd5e1;
  }
  .syntax-sec:first-child { margin-top: 4px; padding-top: 0; border-top: none; }
  .syntax-banner {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    padding: 10px 14px; margin-bottom: 12px; border-radius: 9px;
    border: 1px solid #cbd5e1; border-left: 5px solid #3b82f6; background: #f1f5f9;
  }
  .syntax-banner.sec-ergative { background: #ecfeff; border-color: #a5f3fc; border-left-color: #0891b2; }
  .syntax-banner.sec-transitive { background: #eef2ff; border-color: #c7d2fe; border-left-color: #4f46e5; }
  .syntax-banner.sec-intrans_prep { background: #fffbeb; border-color: #fde68a; border-left-color: #d97706; }
  .syntax-banner.sec-intrans_auto { background: #f1f5f9; border-color: #cbd5e1; border-left-color: #475569; }
  .syntax-title { font-size: 14px; font-weight: 800; color: #0f172a; letter-spacing: -0.01em; }
  .syntax-formula {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
    font-weight: 700; color: #0f172a; background: #ffffff; border: 1px solid rgba(15,23,42,0.12);
    padding: 2px 8px; border-radius: 5px; margin-left: 8px;
  }
  .syntax-note { font-size: 12px; color: #334155; font-weight: 500; }
  .group-count {
    font-size: 12px; font-weight: 700; color: #334155; background: #e2e8f0;
    padding: 2.5px 9px; border-radius: 99px;
  }
  .group-domain {
    font-size: 12px; font-weight: 600; color: #1d4ed8; background: #dbeafe;
    padding: 2.5px 10px; border-radius: 99px;
  }
  .grp-collapse-btn {
    padding: 5px 12px; border-radius: 7px; border: 1px solid #cbd5e1;
    background: #f8fafc; color: #334155; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.12s;
  }
  .grp-collapse-btn:hover { background: #0f172a; color: #ffffff; border-color: #0f172a; }
  .scale-legend {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin-top: 8px; font-size: 11.5px; color: #64748b; font-weight: 500;
  }
  .scale-legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; }
  .group-body { margin-top: 14px; }
  .group-card.is-collapsed .group-body { display: none; }
  .group-desc-en {
    padding: 9px 13px; background: #f8fafc; border-left: 3px solid #3b82f6;
    border-radius: 0 8px 8px 0; font-size: 12.8px; line-height: 1.55; color: #334155;
    margin-bottom: 14px;
  }
  .group-desc-zh {
    padding: 7px 13px; background: #fefce8; border-left: 3px solid #eab308;
    border-radius: 0 8px 8px 0; font-size: 12.3px; line-height: 1.5; color: #713f12;
    margin-top: -8px; margin-bottom: 14px;
  }

  /* 单词卡片网格 */
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 10px; }
  .verb-card {
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  }
  .verb-card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,0.06); border-color: #cbd5e1; }
  .verb-card.is-pv { background: #faf5ff; border-color: #e9d5ff; }
  .verb-card.lv-1 { border-left: 3.5px solid #10b981; }
  .verb-card.lv-2 { border-left: 3.5px solid #3b82f6; }
  .verb-card.lv-3 { border-left: 3.5px solid #eab308; }
  .verb-card.lv-4 { border-left: 3.5px solid #f97316; }
  .verb-card.lv-5 { border-left: 3.5px solid #ef4444; }

  .v-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
  .v-head { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .v-lemma { font-size: 15.5px; font-weight: 800; color: #0f172a; }

  .tag-trans {
    font-size: 10px; font-weight: 700; padding: 1.5px 6px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .tag-val-erg { background: #ecfeff; color: #0e7490; border: 1px solid #cffafe; }
  .tag-val-tr { background: #eef2ff; color: #3730a3; border: 1px solid #e0e7ff; }
  .tag-val-trprep { background: #fae8ff; color: #86198f; border: 1px solid #f5d0fe; }
  .tag-val-prep { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .tag-val-auto { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }

  .tag-pv { font-size: 10px; font-weight: 800; padding: 1.5px 5px; border-radius: 4px; background: #7c3aed; color: #ffffff; }
  .ex-toggle-btn {
    font-size: 10.5px; font-weight: 600; padding: 1.5px 6px; border-radius: 4px;
    border: 1px solid #e2e8f0; background: #f8fafc; color: #64748b; cursor: pointer;
  }
  .ex-toggle-btn:hover, .ex-toggle-btn.open { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }

  .energy-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px; border-radius: 5px; border: 1px solid #e2e8f0;
    background: #ffffff; font-size: 10.5px; font-weight: 600; color: #475569; white-space: nowrap;
  }
  .bars { display: inline-flex; gap: 2px; }
  .bar { width: 3px; height: 9px; border-radius: 1.5px; }

  .v-zh { font-size: 12.5px; font-weight: 600; color: #1e293b; margin-bottom: 3px; }
  .v-en { font-size: 12.5px; line-height: 1.48; color: #475569; }
  .sense-line { margin-top: 3px; }
  .sense-line:first-child { margin-top: 0; }

  .v-ex-box {
    margin-top: 8px; padding: 7px 10px; background: #f8fafc;
    border-left: 2.5px solid #cbd5e1; border-radius: 0 6px 6px 0;
    font-size: 12px; line-height: 1.5; color: #475569;
  }
  .verb-card.is-pv .v-ex-box { background: #f5f3ff; border-left-color: #c4b5fd; }
  .v-ex-en { font-style: italic; color: #334155; }
  .v-ex-en b.hl-v { font-style: normal; font-weight: 700; color: #0f172a; }
  .v-ex-zh { margin-top: 3px; font-size: 11.5px; color: #64748b; }
  .ex-dir-tag {
    display: inline-block; font-style: normal; font-size: 9.5px; font-weight: 800;
    padding: 0.5px 5px; border-radius: 3.5px; margin-right: 5px; letter-spacing: 0.02em;
    vertical-align: 0.5px;
  }
  .ex-dir-caus { background: #e0e7ff; color: #3730a3; }
  .ex-dir-auto { background: #ccfbf1; color: #0f766e; }
  .v-ex-pair-div { margin: 6px 0; border-top: 1px dashed #cbd5e1; }

  .v-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 10px; padding-top: 7px; border-top: 1px dashed #f1f5f9;
  }
  .badges-left { display: flex; align-items: center; gap: 5px; }
  .tier-badge {
    font-size: 9.5px; font-weight: 800; text-transform: uppercase;
    padding: 1.5px 6px; border-radius: 4px; letter-spacing: 0.03em;
  }
  .tier-core { background: #dcfce7; color: #15803d; }
  .tier-common { background: #dbeafe; color: #1d4ed8; }
  .tier-uncommon { background: #f1f5f9; color: #475569; }

  .reg-badge { font-size: 10px; font-weight: 600; padding: 1.5px 6px; border-radius: 4px; }
  .reg-formal { background: #f1f5f9; color: #334155; }
  .reg-neutral { background: #f8fafc; color: #64748b; }
  .reg-informal { background: #fef3c7; color: #92400e; }
  .reg-literary { background: #f3e8ff; color: #6b21a8; }

  .meta-right { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #94a3b8; }
  .rank-link { color: #2563eb; text-decoration: none; font-weight: 600; }
  .rank-link:hover { text-decoration: underline; }
  .pv-foot-lbl { font-size: 10.5px; color: #94a3b8; }

  .sec-more-btn {
    margin-top: 9px; width: 100%; padding: 6px 12px; border: 1px dashed #cbd5e1;
    border-radius: 8px; background: #f8fafc; color: #475569; font-size: 12px;
    font-weight: 600; cursor: pointer; text-align: center;
  }
  .sec-more-btn:hover { background: #eff6ff; color: #2563eb; border-color: #93c5fd; }

  .load-more {
    padding: 11px 18px; background: #0f172a; color: #ffffff; border: none;
    border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; align-self: center;
  }
  .load-more:hover { background: #1e293b; }

  /* 移动端抽屉适配 */
  .mobile-bar { display: none; }
  .drawer-mask { display: none; }
  @media (max-width: 820px) {
    body { flex-direction: column; height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 280px; max-width: 82vw;
      z-index: 1000; transform: translateX(-105%); transition: transform 0.22s ease;
      box-shadow: 4px 0 24px rgba(15,23,42,0.18);
    }
    .sidebar.open { transform: translateX(0); }
    .drawer-mask.open {
      display: block; position: fixed; inset: 0; background: rgba(15,23,42,0.42);
      z-index: 999; backdrop-filter: blur(2px);
    }
    .mobile-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 14px; background: #ffffff; border-bottom: 1px solid #e2e8f0;
      position: sticky; top: 0; z-index: 20;
    }
    .menu-toggle {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
      background: #0f172a; color: #ffffff; border: none; border-radius: 7px;
      font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .mobile-back { font-size: 12px; color: #2563eb; text-decoration: none; font-weight: 600; }
    .main { overflow: visible; }
    .topbar { padding: 10px 14px; }
    .topbar-head { flex-direction: column; align-items: flex-start; gap: 4px; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; width: 100%; overflow: visible; }
    .ctrl { width: 100%; font-size: 12px; }
    .search-input, .reset-btn { grid-column: 1 / -1; max-width: none; width: 100%; }
    .content { padding: 12px 12px 40px; gap: 14px; overflow: visible; }
    .group-card { padding: 14px; border-radius: 12px; }
    .items-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="drawer-mask" id="drawerMask" onclick="closeDrawer()"></div>
<div class="mobile-bar">
  <button class="menu-toggle" onclick="openDrawer()">☰ <span id="mobileCurrentLbl">1. Synonym Sets</span></button>
  <a class="mobile-back" href="./index.html">← Dictionary</a>
</div>

<aside class="sidebar">
  <div class="brand">
    <h1>🧭 动词四维语义辨析库</h1>
    <div class="meta-row" id="metaInfo"><span>Loading...</span><a href="./index.html">← Dictionary</a></div>
  </div>
  <div class="mode-list" id="modeList"></div>
  <div class="dom-header">SEMANTIC DOMAINS</div>
  <div class="dom-list" id="domList"></div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="topbar-head">
      <div class="mode-desc" id="modeDesc"></div>
      <div class="stat-pill" id="statPill"></div>
    </div>
    <div class="filters">
      <button class="ctrl toggle-btn" id="zhToggle" onclick="toggleZh()">Chinese: OFF</button>
      <button class="ctrl toggle-btn" id="exToggle" onclick="toggleAllEx()">Examples: OFF</button>
      <button class="ctrl toggle-btn" id="collapseAllBtn" onclick="toggleCollapseAllGroups()">Collapse All</button>
      <select class="ctrl" id="tierFilter" onchange="resetAndRender()">
        <option value="ALL">All Frequency Tiers</option>
        <option value="core">Core</option>
        <option value="common">Common</option>
        <option value="uncommon">Uncommon</option>
      </select>
      <select class="ctrl" id="regFilter" onchange="resetAndRender()">
        <option value="ALL">All Registers</option>
        <option value="formal">Formal</option>
        <option value="neutral">Neutral</option>
        <option value="informal">Informal</option>
        <option value="literary">Literary</option>
      </select>
      <select class="ctrl" id="transFilter" onchange="resetAndRender()">
        <option value="ALL">All Syntax Patterns</option>
        <option value="ergative">Ergative: Sth V ↔ Sb V sth</option>
        <option value="transitive">Transitive: Sb/Sth V sth (+ prep)</option>
        <option value="intrans_prep">Intrans + Prep: Sb V + prep + sth</option>
        <option value="intrans_auto">Autonomous: Sth/Sb V</option>
      </select>
      <select class="ctrl" id="pvFilter" onchange="resetAndRender()">
        <option value="ALL">All Entries (Single + PV)</option>
        <option value="SINGLE">Single Verbs Only</option>
        <option value="PV">Phrasal Verbs Only</option>
      </select>
      <input class="ctrl search-input" id="kwInput" type="text" placeholder="Filter verbs, phrases, or meaning..." oninput="resetAndRender()">
      <button class="reset-btn" onclick="resetFilters()">Reset</button>
    </div>
  </header>
  <section class="content" id="groupContainer"></section>
</main>

<script>
const MODES = [
  { id: "synonym", en: "1. Synonym Sets", zh: "1. 同义替换组", icon: "🔄", descEn: "Verbs sharing a core concept, distinguished by register, nuance, and collocation", descZh: "核心概念相同、可按语域与搭配互换的近义动词辨析组" },
  { id: "intensity", en: "2. Intensity Scales", zh: "2. 情感/强弱梯度组", icon: "📈", descEn: "Related verbs ordered by emotional charge and force (Mild ➔ Light ➔ Moderate ➔ Strong ➔ Extreme)", descZh: "相近动作按情感色彩与力度从轻到重排列（Mild ➔ Light ➔ Moderate ➔ Strong ➔ Extreme）" },
  { id: "manner", en: "3. Manner & Nuance", zh: "3. 动作神态/方式细分组", icon: "🎭", descEn: "Distinct physical manners, postures, or ways of performing a base action (e.g., glance / gaze / glare)", descZh: "同一基础动作的不同神态、姿态与执行方式区分（如 smile / grin / smirk，glance / gaze / glare）" },
  { id: "scenario", en: "4. Thematic Frames", zh: "4. 主题场景聚合组", icon: "🎬", descEn: "Core verbs and phrasal verbs clustered around real-world situations and domains", descZh: "同一高频生活、职场或社会场景下的核心动词与短语动词网络" }
];

const DOM_EN = {
  manipulation: "Physical Action & Manipulation", physical_action: "Physical Action & Manipulation",
  motion: "Motion & Spatial Movement", motion_space: "Motion & Spatial Movement",
  communication: "Communication & Expression", change_state: "Change of State & Quality",
  bodily_life: "Bodily Action & Life", social_governance: "Social & Power Interaction",
  cognition: "Cognition & Judgment", creation_destruction: "Creation & Destruction",
  conflict: "Conflict, Attack & Defense", perception: "Perception & Appearance",
  transfer_possession: "Transfer & Possession", emotion: "Emotion & Attitude",
  quantity_degree: "Quantity, Degree & Trend", existence_occurrence: "Existence & Time",
  existence_time: "Existence & Time"
};
const DOM_ZH = {
  manipulation: "物理操作与物体位移", physical_action: "物理操作与物体位移",
  motion: "位移与空间运动", motion_space: "位移与空间运动",
  communication: "言语、表达与沟通", change_state: "形态与性质改变",
  bodily_life: "身体动作与生理生命", social_governance: "社交、合作与权力互动",
  cognition: "认知、思考与判断", creation_destruction: "创建、建造与销毁",
  conflict: "冲突、攻击与防御", perception: "感知、观察与显现",
  transfer_possession: "给予、获取与交易", emotion: "情感、态度与心理变化",
  quantity_degree: "数量、程度与变化趋势", existence_occurrence: "存在、发生与时间维持",
  existence_time: "存在、发生与时间维持"
};

function formatGroupTitle(raw) {
  if (!raw) return "";
  if (showZh) return raw;
  return raw.replace(/\s*·\s*[^(\n]+(?=\s*\(|$)/, " ").replace(/\s+\(/, " (").trim();
}

function formatDefEn(raw) {
  if (!raw) return "";
  const parts = raw.split(/\s*(?=\b[1-9]\.\s)/).filter(Boolean);
  if (parts.length <= 1) return raw;
  const shown = parts.slice(0, 2);
  const extra = parts.length - 2;
  return shown.map(p => `<div class="sense-line">${p.trim()}</div>`).join("") +
    (extra > 0 ? `<div style="font-size:11px;color:#94a3b8;margin-top:2px;">+${extra} more sense${extra > 1 ? 's' : ''}</div>` : "");
}

function formatExampleEn(ex, lemma, prep = "") {
  if (!ex) return "";
  const tokens = lemma.trim().split(/\s+/);
  const head = tokens[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // 不规则变化常见词根兼容（如 cut/cuts/cutting, shrink/shrank/shrunk, break/broke/broken 等保留原词匹配）
  const vPat = `\\b(${head}(?:s|es|ed|d|ing)?)\\b`;

  if (tokens.length > 1) {
    // 短语动词：同时高亮动词与后面紧跟或隔开 1-4 个词的小品词/介词（如 cut down 或 cut costs down）
    const particles = tokens.slice(1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+");
    const rxAdjacent = new RegExp(`${vPat}(\\s+${particles})\\b`, "i");
    if (rxAdjacent.test(ex)) {
      return ex.replace(rxAdjacent, '<b class="hl-v">$1$2</b>');
    }
    const rxSplit = new RegExp(`${vPat}((?:\\s+\\S+){1,4}?\\s+)(${particles})\\b`, "i");
    if (rxSplit.test(ex)) {
      return ex.replace(rxSplit, '<b class="hl-v">$1</b>$2<b class="hl-v">$3</b>');
    }
  }

  // 单体动词：先高亮动词本身，如果带有固定介词（如 at / of / from / to），顺带高亮后续首个对应介词
  let out = ex.replace(new RegExp(vPat, "i"), '<b class="hl-v">$1</b>');
  if (prep) {
    const firstPrep = prep.split("/")[0].trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (firstPrep) {
      const rxPrep = new RegExp(`(<b class="hl-v">.*?<\\/b>(?:\\s+\\S+){0,5}?\\s+)\\b(${firstPrep})\\b`, "i");
      out = out.replace(rxPrep, '$1<b class="hl-v">$2</b>');
    }
  }
  return out;
}

function toggleZh() {
  showZh = !showZh;
  const btn = document.getElementById("zhToggle");
  btn.textContent = showZh ? "中文释义：开" : "Chinese: OFF";
  btn.classList.toggle("active-zh", showZh);
  const exBtn = document.getElementById("exToggle");
  exBtn.textContent = showZh ? (showAllEx ? "例句：全开" : "例句：折叠") : (showAllEx ? "Examples: ON" : "Examples: OFF");
  const colBtn = document.getElementById("collapseAllBtn");
  colBtn.textContent = showZh ? (allGroupsCollapsed ? "展开全部大类" : "收起全部大类") : (allGroupsCollapsed ? "Expand All" : "Collapse All");
  renderSidebar();
  renderGroups();
}

function toggleAllEx() {
  showAllEx = !showAllEx;
  const btn = document.getElementById("exToggle");
  btn.textContent = showZh ? (showAllEx ? "例句：全开" : "例句：折叠") : (showAllEx ? "Examples: ON" : "Examples: OFF");
  btn.classList.toggle("active-zh", showAllEx);
  renderGroups();
}

function toggleCardEx(btn, ev) {
  if (ev) ev.stopPropagation();
  const box = btn.closest(".verb-card").querySelector(".v-ex-box");
  if (!box) return;
  const isHidden = box.style.display === "none";
  box.style.display = isHidden ? "block" : "none";
  btn.classList.toggle("open", isHidden);
}

function expandSyntaxSec(secId) {
  expandedSecs.add(secId);
  renderGroups();
}

function toggleGroupCollapse(gName, ev) {
  if (ev) ev.stopPropagation();
  if (collapsedGroups.has(gName)) {
    collapsedGroups.delete(gName);
  } else {
    collapsedGroups.add(gName);
  }
  renderGroups();
}

function toggleCollapseAllGroups() {
  allGroupsCollapsed = !allGroupsCollapsed;
  const btn = document.getElementById("collapseAllBtn");
  btn.textContent = showZh
    ? (allGroupsCollapsed ? "展开全部大类" : "收起全部大类")
    : (allGroupsCollapsed ? "Expand All" : "Collapse All");
  btn.classList.toggle("active-zh", allGroupsCollapsed);
  collapsedGroups.clear();
  if (allGroupsCollapsed) {
    for (const g of filteredGroups) collapsedGroups.add(g.name);
  }
  renderGroups();
}

function renderSidebar() {
  const counts = { synonym: 0, intensity: 0, manner: 0, scenario: 0 };
  let validGroups = 0;
  for (const g of DATA.groups) {
    if (g.items.length < 2) continue;
    validGroups++;
    counts[g.mode] = (counts[g.mode] || 0) + g.items.length;
  }
  document.getElementById("metaInfo").innerHTML = showZh
    ? `<span>共 ${validGroups} 个母语框架组</span><a href="./index.html">← 返回主词典</a>`
    : `<span>${validGroups} Semantic Frames</span><a href="./index.html">← Dictionary</a>`;

  document.querySelector(".dom-header").textContent = showZh ? "按语义领域筛选" : "SEMANTIC DOMAINS";
  document.getElementById("kwInput").placeholder = showZh ? "搜索动词、短语或中文..." : "Filter verbs, phrases, or meaning...";
  document.getElementById("tierFilter").options[0].text = showZh ? "全部词频" : "All Frequency Tiers";
  document.getElementById("regFilter").options[0].text = showZh ? "全部语域" : "All Registers";
  document.getElementById("transFilter").options[0].text = showZh ? "全部句法结构" : "All Syntax Patterns";
  document.getElementById("transFilter").options[1].text = showZh ? "自变/致使双用 (Sth V ↔ Sb V sth)" : "Ergative: Sth V ↔ Sb V sth";
  document.getElementById("transFilter").options[2].text = showZh ? "纯及物外力 (Sb/Sth V sth)" : "Transitive: Sb/Sth V sth (+ prep)";
  document.getElementById("transFilter").options[3].text = showZh ? "不及物+介词 (Sb V + prep + sth)" : "Intrans + Prep: Sb V + prep + sth";
  document.getElementById("transFilter").options[4].text = showZh ? "纯自主不及物 (Sth/Sb V)" : "Autonomous: Sth/Sb V";
  document.getElementById("pvFilter").options[0].text = showZh ? "全部词条" : "All Entries (Single + PV)";
  document.getElementById("pvFilter").options[1].text = showZh ? "仅单词动词" : "Single Verbs Only";
  document.getElementById("pvFilter").options[2].text = showZh ? "仅短语动词" : "Phrasal Verbs Only";

  document.getElementById("modeList").innerHTML = MODES.map(m => `
    <button class="mode-btn ${m.id === activeMode ? 'active' : ''}" onclick="selectMode('${m.id}')">
      <span>${m.icon} ${showZh ? m.zh : m.en}</span>
      <span class="mode-badge">${counts[m.id] || 0}</span>
    </button>
  `).join("");

  const domCounts = {};
  let totalInMode = 0;
  for (const g of DATA.groups) {
    if (g.mode !== activeMode || g.items.length < 2) continue;
    domCounts[g.domain] = (domCounts[g.domain] || 0) + g.items.length;
    totalInMode += g.items.length;
  }
  const sortedDoms = Object.entries(domCounts).sort((a, b) => b[1] - a[1]);
  document.getElementById("domList").innerHTML = `
    <button class="dom-btn ${activeDom === 'ALL' ? 'active' : ''}" onclick="selectDom('ALL')">
      <span>${showZh ? '全部领域' : 'All Semantic Domains'}</span><span class="dom-count">${totalInMode}</span>
    </button>
  ` + sortedDoms.map(([key, c]) => `
    <button class="dom-btn ${activeDom === key ? 'active' : ''}" onclick="selectDom('${key}')">
      <span>${domLabel(key)}</span><span class="dom-count">${c}</span>
    </button>
  `).join("");
}

function selectMode(m) {
  activeMode = m;
  activeDom = "ALL";
  renderLimit = 40;
  expandedSecs.clear();
  closeDrawer();
  renderSidebar();
  renderGroups();
}

function selectDom(d) {
  activeDom = d;
  renderLimit = 40;
  expandedSecs.clear();
  closeDrawer();
  renderSidebar();
  renderGroups();
}

function resetAndRender() {
  renderLimit = 40;
  expandedSecs.clear();
  renderGroups();
}

function resetFilters() {
  document.getElementById("tierFilter").value = "ALL";
  document.getElementById("regFilter").value = "ALL";
  document.getElementById("transFilter").value = "ALL";
  document.getElementById("pvFilter").value = "ALL";
  document.getElementById("kwInput").value = "";
  activeDom = "ALL";
  renderLimit = 40;
  expandedSecs.clear();
  renderSidebar();
  renderGroups();
}

function renderGroups() {
  const mObj = MODES.find(m => m.id === activeMode);
  document.getElementById("modeDesc").innerHTML = `${mObj.icon} ${showZh ? mObj.descZh : mObj.descEn}`;
  const mLbl = document.getElementById("mobileCurrentLbl");
  if (mLbl) mLbl.textContent = showZh ? mObj.zh : mObj.en;

  const tierVal = document.getElementById("tierFilter").value;
  const regVal = document.getElementById("regFilter").value;
  const transVal = document.getElementById("transFilter").value;
  const pvVal = document.getElementById("pvFilter").value;
  const kw = document.getElementById("kwInput").value.trim().toLowerCase();

  filteredGroups = [];
  let totalMatchedWords = 0;

  for (const g of DATA.groups) {
    if (g.mode !== activeMode || g.items.length < 2) continue;
    if (activeDom !== "ALL" && g.domain !== activeDom) continue;

    const groupTitleMatched = kw && g.name.toLowerCase().includes(kw);
    const matchedItems = g.items.filter(it => {
      if (tierVal !== "ALL" && it.tier !== tierVal) return false;
      const reg = (it.register || "neutral").toLowerCase();
      if (regVal !== "ALL" && reg !== regVal) return false;
      const valType = it.valency || (it.trans === "I" ? "intrans_auto" : "transitive");
      if (transVal !== "ALL") {
        const matchAutoOpt = (transVal === "intrans_auto" && valType === "intrans_prep" && it.prep_opt);
        if (valType !== transVal && !matchAutoOpt) return false;
      }
      const isPv = Boolean(it.is_pv) || it.lemma.includes(" ");
      if (pvVal === "SINGLE" && isPv) return false;
      if (pvVal === "PV" && !isPv) return false;
      if (kw && !groupTitleMatched) {
        const hay = `${it.lemma} ${it.def_en || ""} ${it.def_zh || ""}`.toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });

    if (matchedItems.length >= 2 || (kw && matchedItems.length >= 1)) {
      filteredGroups.push({ ...g, matchedItems });
      totalMatchedWords += matchedItems.length;
    }
  }

  document.getElementById("statPill").textContent = showZh
    ? `当前匹配 ${filteredGroups.length} 组 · ${totalMatchedWords} 词`
    : `${filteredGroups.length} Frames · ${totalMatchedWords} Verbs`;

  const container = document.getElementById("groupContainer");
  if (!filteredGroups.length) {
    container.innerHTML = `<div style="padding:40px;text-align:center;color:#64748b;">${showZh ? "未找到符合条件的动词框，请放宽筛选条件。" : "No matching verb frames found. Try resetting filters."}</div>`;
    return;
  }

  const showLv = activeMode === "intensity";
  const visible = filteredGroups.slice(0, renderLimit);

  container.innerHTML = visible.map(g => {
    const scaleLegend = showLv ? `
      <div class="scale-legend">
        <span>${showZh ? "梯度：" : "Scale:"}</span>
        <span><span class="dot" style="background:#10b981"></span>Mild</span><span>→</span>
        <span><span class="dot" style="background:#3b82f6"></span>Light</span><span>→</span>
        <span><span class="dot" style="background:#eab308"></span>Moderate</span><span>→</span>
        <span><span class="dot" style="background:#f97316"></span>Strong</span><span>→</span>
        <span><span class="dot" style="background:#ef4444"></span>Extreme</span>
      </div>` : "";

    const renderSingleCard = (it) => {
      const isPv = Boolean(it.is_pv) || it.lemma.includes(" ");
      const lv = Math.max(1, Math.min(5, parseInt(it.intensity || 3, 10)));
      const lvInfo = LV_META[lv];
      const valType = it.valency || (it.trans === "I" ? "intrans_auto" : "transitive");
      const vMeta = VALENCY_META[valType] || VALENCY_META.transitive;
      let badgeFormula = vMeta.formula;
      let badgeCls = vMeta.cls;
      if (valType === "intrans_prep" && it.prep) {
        badgeFormula = it.prep_opt ? `Sth/Sb V (+ ${it.prep} sth)` : `Sb/Sth V + ${it.prep} sth`;
      } else if (valType === "transitive" && it.prep) {
        badgeFormula = `Sb V sth + ${it.prep} sth`;
        badgeCls = "tag-val-trprep";
      }
      const badgeText = showZh
        ? (valType === "intrans_prep" && it.prep
            ? (it.prep_opt ? `自主 / + ${it.prep}` : `不及物 + ${it.prep}`)
            : (valType === "transitive" && it.prep ? `及物 sth + ${it.prep}` : vMeta.zhTitle.split("（")[0]))
        : badgeFormula;

      const tier = (it.tier || "common").toLowerCase();
      const tierClass = tier === "core" ? "tier-core" : (tier === "uncommon" ? "tier-uncommon" : "tier-common");
      const reg = (it.register || "neutral").toLowerCase();
      const regMapLabel = { formal: "Formal", neutral: "Neutral", informal: "Informal", literary: "Literary" };
      const regLabel = regMapLabel[reg] || "Neutral";

      const energyHtml = showLv ? `
        <div class="energy-pill">
          <span class="bars">
            ${[1,2,3,4,5].map(i => `<span class="bar" style="background:${i <= lv ? lvInfo.color : '#e2e8f0'}"></span>`).join("")}
          </span>
          <span>${lvInfo.name}</span>
        </div>` : "";

      const footRight = it.rank
        ? `<a class="rank-link" href="./index.html?q=${encodeURIComponent(it.headword || it.lemma)}" target="_blank">#${it.rank} ↗</a>`
        : `<span class="pv-foot-lbl">${isPv ? "Phrasal Verb" : ""}</span>`;

      const exBtnHtml = it.ex_en
        ? `<button class="ex-toggle-btn ${showAllEx ? 'open' : ''}" onclick="toggleCardEx(this, event)" title="Toggle example sentence">Ex ▾</button>`
        : "";

      return `
        <div class="verb-card ${isPv ? 'is-pv' : ''} ${showLv ? 'lv-' + lv : ''}">
          <div>
            <div class="v-top">
              <div class="v-head">
                <span class="v-lemma">${it.lemma}</span>
                <span class="tag-trans ${badgeCls}" title="${vMeta.enNote}">${badgeText}</span>
                ${isPv ? '<span class="tag-pv">PV</span>' : ''}
              </div>
              <div style="display:flex;align-items:center;gap:4px;">
                ${energyHtml}
                ${exBtnHtml}
              </div>
            </div>
            ${(showZh && it.def_zh) ? `<div class="v-zh">${it.def_zh}</div>` : ""}
            <div class="v-en">${formatDefEn(it.def_en)}</div>
            ${it.ex_en ? (() => {
              const isErgPair = valType === "ergative" && it.ex2_en;
              const dir1 = it.ex_dir === "autonomous" ? "auto" : "caus";
              const dir2 = dir1 === "caus" ? "auto" : "caus";
              const tag1 = isErgPair
                ? `<span class="ex-dir-tag ${dir1 === 'caus' ? 'ex-dir-caus' : 'ex-dir-auto'}">${dir1 === 'caus' ? (showZh ? '致使 Sb V sth' : 'Causative') : (showZh ? '自主 Sth V' : 'Autonomous')}</span>`
                : "";
              const tag2 = isErgPair
                ? `<span class="ex-dir-tag ${dir2 === 'caus' ? 'ex-dir-caus' : 'ex-dir-auto'}">${dir2 === 'caus' ? (showZh ? '致使 Sb V sth' : 'Causative') : (showZh ? '自主 Sth V' : 'Autonomous')}</span>`
                : "";
              return `
                <div class="v-ex-box" style="display:${showAllEx ? 'block' : 'none'};">
                  <div class="v-ex-en">${tag1}“${formatExampleEn(it.ex_en, it.lemma, it.prep)}”</div>
                  ${(showZh && it.ex_zh) ? `<div class="v-ex-zh">${it.ex_zh}</div>` : ""}
                  ${isErgPair ? `
                    <div class="v-ex-pair-div"></div>
                    <div class="v-ex-en">${tag2}“${formatExampleEn(it.ex2_en, it.lemma, it.prep)}”</div>
                    ${(showZh && it.ex2_zh) ? `<div class="v-ex-zh">${it.ex2_zh}</div>` : ""}
                  ` : ""}
                </div>`;
            })() : ""}
          </div>
          <div class="v-foot">
            <div class="badges-left">
              <span class="tier-badge ${tierClass}">${tier}</span>
              <span class="reg-badge reg-${reg}">${regLabel}</span>
            </div>
            <div class="meta-right">
              ${it.zipf ? `<span class="zipf-txt">Zipf ${it.zipf}</span>` : ""}
              ${footRight}
            </div>
          </div>
        </div>
      `;
    };

    let bodyGridHtml = "";
    if (showLv) {
      bodyGridHtml = `<div class="items-grid">${g.matchedItems.map(renderSingleCard).join("")}</div>`;
    } else {
      const buckets = { ergative: [], transitive: [], intrans_prep: [], intrans_auto: [] };
      for (const it of g.matchedItems) {
        const vt = it.valency || (it.trans === "I" ? "intrans_auto" : "transitive");
        (buckets[vt] || buckets.transitive).push(it);
      }
      const activeBuckets = Object.entries(buckets).filter(([, arr]) => arr.length > 0);
      bodyGridHtml = activeBuckets.map(([vt, arr]) => {
        const vm = VALENCY_META[vt];
        const secTitle = showZh ? vm.zhTitle : vm.enTitle;
        const secNote = showZh ? vm.zhNote : vm.enNote;
        const secId = `${g.name}::${vt}`;
        const isExpanded = expandedSecs.has(secId) || kw.length > 0;
        const CAP = 6;
        const shownArr = isExpanded ? arr : arr.slice(0, CAP);
        const hiddenCnt = arr.length - shownArr.length;
        const moreBtn = hiddenCnt > 0
          ? `<button class="sec-more-btn" onclick="expandSyntaxSec(${JSON.stringify(secId).replace(/"/g, '&quot;')})">${showZh ? `+ 展开其余 ${hiddenCnt} 个同句法动词` : `+ Show ${hiddenCnt} more verbs in this syntax pattern`}</button>`
          : "";
        return `
          <div class="syntax-sec">
            <div class="syntax-banner sec-${vt}">
              <div>
                <span class="syntax-title">${secTitle} (${arr.length})</span>
                <span class="syntax-formula">${vm.formula}</span>
              </div>
              <div class="syntax-note">${secNote}</div>
            </div>
            <div class="items-grid">${shownArr.map(renderSingleCard).join("")}</div>
            ${moreBtn}
          </div>
        `;
      }).join("");
    }

    const isGrpCollapsed = allGroupsCollapsed ? !collapsedGroups.has(g.name) : collapsedGroups.has(g.name);
    const collapseLbl = showZh
      ? (isGrpCollapsed ? "展开 ▾" : "收起 ▴")
      : (isGrpCollapsed ? "Expand ▾" : "Collapse ▴");
    const safeGName = JSON.stringify(g.name).replace(/"/g, "&quot;");

    return `
      <section class="group-card ${isGrpCollapsed ? 'is-collapsed' : ''}">
        <div class="group-header" onclick="toggleGroupCollapse(${safeGName}, event)">
          <div style="flex:1;min-width:0;">
            <div class="group-title-row">
              <h2 class="group-title">${formatGroupTitle(g.name)}</h2>
              <span class="group-count">${g.matchedItems.length} ${showZh ? '词' : 'verbs'}</span>
              <span class="group-domain">${domLabel(g.domain)}</span>
            </div>
            ${(!isGrpCollapsed && scaleLegend) ? scaleLegend : ""}
          </div>
          <button class="grp-collapse-btn" onclick="toggleGroupCollapse(${safeGName}, event)">${collapseLbl}</button>
        </div>
        <div class="group-body">
          ${g.desc_en ? `<div class="group-desc-en">${g.desc_en}</div>` : ""}
          ${(showZh && g.desc_zh) ? `<div class="group-desc-zh">${g.desc_zh}</div>` : ""}
          ${bodyGridHtml}
        </div>
      </section>
    `;
  }).join("");

  if (filteredGroups.length > renderLimit) {
    const moreTxt = showZh
      ? `加载更多框架组（剩余 ${filteredGroups.length - renderLimit} 组）`
      : `Load More Frames (${filteredGroups.length - renderLimit} remaining)`;
    container.innerHTML += `<button class="load-more" onclick="renderLimit += 40; renderGroups();">${moreTxt}</button>`;
  }
}

fetch("./verb_taxonomy_v2.json")
  .then(r => r.json())
  .then(d => {
    DATA = d;
    renderSidebar();
    renderGroups();
  })
  .catch(err => {
    document.getElementById("groupContainer").innerHTML = `<div style="padding:40px;text-align:center;color:#dc2626;">加载失败: ${err}</div>`;
  });
</script>
</body>
</html>
